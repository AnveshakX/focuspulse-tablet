name: Build JEE Timer Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Project with Exact Unchanged JEE Timer.html
        run: |
          NEWEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Extracting $NEWEST_ZIP..."
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          unzip -o "$NEWEST_ZIP"
          if [ -f "JEE Timer.html" ]; then
            cp -f "JEE Timer.html" app/src/main/assets/www/index.html
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload JEE Timer APK
        uses: actions/upload-artifact@v4
        with:
          name: JEE-Timer-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
