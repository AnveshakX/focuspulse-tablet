name: Build FocusPulse Android Tablet APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Newest Verified Java Project ZIP
        run: |
          NEWEST_ZIP=$(ls -t *.zip | head -n 1)
          echo "Extracting $NEWEST_ZIP..."
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          unzip -o "$NEWEST_ZIP"
          find app -name "*.kt" -delete

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled Android Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusPulse-Android-Tablet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
